<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTracker - Scheda & Progressioni</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- LOGIN CARD -->
  <div id="login-container" class="card">
    <div class="header-logo">
      <div class="icon">💪</div>
      <h2>Area Riservata</h2>
      <p>Accedi per la tua scheda di allenamento</p>
    </div>
    <form id="login-form">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Inserisci il tuo nome" required>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary">Accedi al Workout</button>
    </form>
    <p id="login-error" class="error"></p>
  </div>

  <!-- DASHBOARD WORKOUT -->
  <div id="dashboard" class="card hidden">
    <div class="dash-header">
      <div>
        <span class="badge">Aumento Massa Magra</span>
        <h2>Total Body - Programma</h2>
      </div>
      <button id="logout-btn" class="btn-secondary">Esci</button>
    </div>

    <!-- CALENDARIO -->
    <div class="calendar-section">
      <div class="calendar-header">
        <h3 id="calendar-month-year">Mese Anno</h3>
        <span id="workout-count" class="count-badge">0 allenamenti</span>
      </div>
      
      <div class="calendar-grid-header">
        <div>Lun</div><div>Mar</div><div>Mer</div><div>Gio</div><div>Ven</div><div>Sab</div><div>Dom</div>
      </div>
      <div id="calendar-days" class="calendar-grid"></div>

      <div class="calendar-actions">
        <button id="complete-btn" class="btn-complete">✅ Completa Allenamento Oggi</button>
        <button id="export-ics-btn" class="btn-ics">📲 Aggiungi a Calendario iPhone</button>
      </div>
    </div>

    <div class="progress-info">
      📈 <strong>Progressione:</strong> Salva i carichi ad ogni sessione per costruire lo storico dei tuoi aumenti di peso.
    </div>

    <div id="workout-list"></div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
