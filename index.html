<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTracker - Scheda & Calendario Interattivo</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- LOGIN CARD -->
  <div id="login-container" class="card">
    <div class="header-logo">
      <div class="icon">💪</div>
      <h2>Area Riservata</h2>
      <p>Accedi per la tua scheda di allenamento</p>
    </div>
    <form id="login-form">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Inserisci il tuo nome" required>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary">Accedi al Workout</button>
    </form>
    <p id="login-error" class="error"></p>
  </div>

  <!-- DASHBOARD WORKOUT -->
  <div id="dashboard" class="card hidden">
    <div class="dash-header">
      <div>
        <span class="badge">Aumento Massa Magra</span>
        <h2>Programma 3 Giorni</h2>
      </div>
      <button id="logout-btn" class="btn-secondary">Esci</button>
    </div>

    <!-- CALENDARIO INTERATTIVO -->
    <div class="calendar-section">
      <div class="calendar-header">
        <h3 id="calendar-month-year">Mese Anno</h3>
        <span id="workout-count" class="count-badge">0 allenamenti</span>
      </div>
      
      <div class="calendar-grid-header">
        <div>Lun</div><div>Mar</div><div>Mer</div><div>Gio</div><div>Ven</div><div>Sab</div><div>Dom</div>
      </div>
      <div id="calendar-days" class="calendar-grid"></div>

      <!-- SELEZIONE GIORNO E REGISTRAZIONE -->
      <div class="calendar-actions">
        <div class="selected-day-info">
          <span>Giorno selezionato: <strong id="selected-date-label">Oggi</strong></span>
        </div>
        
        <div class="workout-selector">
          <label>Segna allenamento svolto:</label>
          <div class="btn-group">
            <button class="btn-day-select" onclick="registraWorkoutInData('Giorno 1')">Giorno 1</button>
            <button class="btn-day-select" onclick="registraWorkoutInData('Giorno 2')">Giorno 2</button>
            <button class="btn-day-select" onclick="registraWorkoutInData('Giorno 3')">Giorno 3</button>
          </div>
          <button id="remove-workout-btn" class="btn-secondary" style="width:100%; margin-top:6px; display:none;" onclick="rimuoviWorkoutInData()">❌ Rimuovi Allenamento da questa data</button>
        </div>

        <button id="export-ics-btn" class="btn-ics">📲 Aggiungi a Calendario iPhone</button>
      </div>
    </div>

    <!-- TABS PER VISUALIZZARE SCHEDE GIORNO 1, 2, 3 -->
    <div class="tabs-container">
      <button class="tab-btn active" onclick="cambiaSchedaVista('Giorno 1')">Giorno 1</button>
      <button class="tab-btn" onclick="cambiaSchedaVista('Giorno 2')">Giorno 2</button>
      <button class="tab-btn" onclick="cambiaSchedaVista('Giorno 3')">Giorno 3</button>
    </div>

    <div class="progress-info">
      📈 <strong>Scheda attiva:</strong> <span id="current-tab-label">Giorno 1</span>. Inserisci i carichi e le note per ogni esercizio.
    </div>

    <div id="workout-list"></div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
